<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c2410c">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Read event flyers and add them to your calendar.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FlyerCal">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Flyer Calendar</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--ink:#1f1b16;--mute:#6f675d;--line:#e6e0d8;--acc:#c2410c;--acc-ink:#fff;--soft:#fdeee3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161412;--card:#201d1a;--ink:#f3eee8;--mute:#a39a8e;--line:#34302b;--acc:#f97316;--acc-ink:#1a1008;--soft:#2e2118;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161412;--card:#201d1a;--ink:#f3eee8;--mute:#a39a8e;--line:#34302b;--acc:#f97316;--acc-ink:#1a1008;--soft:#2e2118;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
.top-actions{display:flex;gap:8px;flex-shrink:0}
h1{font-size:1.5rem;margin:0}
.sub{color:var(--mute);margin:0 0 16px}
.iconbtn{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;flex-shrink:0}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 8px}
.list-head h3{margin:0}
.drop{display:block;border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;background:var(--card);cursor:pointer}
.drop.over{border-color:var(--acc);background:var(--soft)}
.drop b{color:var(--acc)}
.drop input{display:none}
#status{margin:10px 0 0;font-size:.9rem;color:var(--mute)}
#status div{padding:2px 0}
.ok{color:#15803d}.bad{color:#b91c1c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ok{color:#4ade80}:root:not([data-theme="light"]) .bad{color:#f87171}}
.cal{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.head h2{font-size:1.1rem;margin:0}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button.p{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dow{font-size:.72rem;color:var(--mute);padding:4px 0}
.day{aspect-ratio:1;border-radius:8px;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.9rem;cursor:pointer;background:transparent;padding:0}
.day.out{color:var(--mute);opacity:.45}
.day.today{border-color:var(--acc)}
.day.sel{background:var(--soft)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--acc);margin-top:3px}
.dot.n{background:transparent}
h3{font-size:1rem;margin:22px 0 8px}
.ev{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.ev .t{font-weight:600}.ev .m{color:var(--mute);font-size:.88rem}
.acts{display:flex;gap:6px;flex-shrink:0}
.acts button{padding:4px 10px;font-size:.85rem}
.empty{color:var(--mute);font-size:.92rem}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:18px;width:min(92vw,420px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;font-size:.82rem;color:var(--mute);margin-top:10px}
input[type=text],input[type=date],input[type=time],input[type=password]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
.row{display:flex;gap:10px}.row>div{flex:1}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.hint{font-size:.85rem;color:var(--mute);margin:8px 0 0;line-height:1.4}
.hint a{color:var(--acc)}
#setup{display:none;margin:0 0 14px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);font-size:.9rem}
#setup.show{display:block}
#install{display:none;margin:0 0 14px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--mute);font-size:.9rem}
#install.show{display:block}
#install b,#setup b{color:var(--ink)}
@media (display-mode:standalone),(display-mode:fullscreen){#install{display:none!important}}
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Flyer Calendar</h1>
    <div class="top-actions">
      <button type="button" class="iconbtn" id="exportBtn">Export</button>
      <button type="button" class="iconbtn" id="settingsBtn" aria-label="Settings">Settings</button>
    </div>
  </div>
  <p class="sub">Drop in flyer screenshots. Gemini reads the event and adds it to your calendar.</p>
  <div id="setup"></div>
  <div id="install"></div>
  <label class="drop" id="drop">
    <input type="file" id="file" accept="image/*" multiple>
    <b>Choose screenshots</b> or drag them here
  </label>
  <div id="status"></div>

  <div class="cal">
    <div class="head">
      <button id="prev" aria-label="Previous month">‹</button>
      <h2 id="mt"></h2>
      <button id="next" aria-label="Next month">›</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="list-head">
    <h3 id="lt">Upcoming</h3>
  </div>
  <div id="list"></div>
  <div id="undated"></div>
</main>

<dialog id="dlg">
  <div id="dtitle" style="font-weight:600">Edit event</div>
  <label>Title<input type="text" id="f-title"></label>
  <label>Date<input type="date" id="f-date"></label>
  <div class="row">
    <div><label>Start<input type="time" id="f-start"></label></div>
    <div><label>End<input type="time" id="f-end"></label></div>
  </div>
  <label>Location<input type="text" id="f-loc"></label>
  <div class="btns"><button id="cancel">Cancel</button><button class="p" id="save">Save</button></div>
</dialog>

<dialog id="settings">
  <div style="font-weight:600">Gemini API key</div>
  <p class="hint">Get a free key at <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a>. Stored only on this device.</p>
  <label>API key<input type="password" id="f-key" autocomplete="off" spellcheck="false" placeholder="AIza…"></label>
  <div class="btns">
    <button type="button" id="clearKey">Clear</button>
    <button type="button" id="cancelSettings">Cancel</button>
    <button type="button" class="p" id="saveKey">Save</button>
  </div>
</dialog>

<script>
(function(){
  var KEY='flyercal:events';
  var API_KEY_STORE='flyercal:geminiKey';
  var GEMINI_MODEL='gemini-3.5-flash-lite';
  var events=[];
  try{events=JSON.parse(localStorage.getItem(KEY)||'[]')||[];}catch(e){events=[];}
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(events));}catch(e){}}
  function getApiKey(){try{return localStorage.getItem(API_KEY_STORE)||'';}catch(e){return '';}}
  function setApiKey(v){try{if(v)localStorage.setItem(API_KEY_STORE,v);else localStorage.removeItem(API_KEY_STORE);}catch(e){}}

  var now=new Date();
  var view=new Date(now.getFullYear(),now.getMonth(),1);
  var sel=null, editing=null;
  var $=function(id){return document.getElementById(id);};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  var today=iso(now);
  function parseISO(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
  function fmtDate(s){return parseISO(s).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});}
  function fmtTime(t){if(!t)return '';var p=t.split(':'),h=+p[0],m=p[1];return ((h%12)||12)+(m==='00'?'':':'+m)+(h<12?' AM':' PM');}
  function when(e){var t=fmtTime(e.start);if(t&&e.end)t+=' – '+fmtTime(e.end);return [e.date?fmtDate(e.date):'',t].filter(Boolean).join(' · ');}

  function evHTML(e){
    var meta=[when(e),e.location].filter(Boolean).join(' · ');
    return '<div class="ev"><div><div class="t">'+esc(e.title||'Untitled event')+'</div><div class="m">'+esc(meta)+'</div></div>'+
      '<div class="acts"><button data-edit="'+e.id+'">Edit</button><button data-del="'+e.id+'">Delete</button></div></div>';
  }
  function sortEv(a,b){return (a.date+(a.start||'')).localeCompare(b.date+(b.start||''));}

  function updateSetupBanner(){
    var el=$('setup');
    if(getApiKey()){el.className='';el.innerHTML='';return;}
    el.className='show';
    el.innerHTML='<b>Add your free Gemini key</b> to read flyers. Tap Settings, then get a key from Google AI Studio.';
  }

  function render(){
    $('mt').textContent=view.toLocaleDateString(undefined,{month:'long',year:'numeric'});
    var g='';['S','M','T','W','T','F','S'].forEach(function(d){g+='<div class="dow">'+d+'</div>';});
    var start=new Date(view.getFullYear(),view.getMonth(),1-view.getDay());
    var has={};events.forEach(function(e){if(e.date)has[e.date]=1;});
    for(var i=0;i<42;i++){
      var d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),k=iso(d);
      var cls='day'+(d.getMonth()!==view.getMonth()?' out':'')+(k===today?' today':'')+(k===sel?' sel':'');
      g+='<button class="'+cls+'" data-day="'+k+'">'+d.getDate()+'<span class="dot'+(has[k]?'':' n')+'"></span></button>';
    }
    $('grid').innerHTML=g;
    var list=events.filter(function(e){return e.date;}).sort(sortEv);
    if(sel){
      $('lt').textContent=fmtDate(sel);
      list=list.filter(function(e){return e.date===sel;});
      $('list').innerHTML=list.length?list.map(evHTML).join(''):'<div class="empty">Nothing on this day. Tap the day again to see all upcoming events.</div>';
    }else{
      $('lt').textContent='Upcoming';
      list=list.filter(function(e){return e.date>=today;});
      $('list').innerHTML=list.length?list.map(evHTML).join(''):'<div class="empty">No events yet. Add a flyer above.</div>';
    }
    var und=events.filter(function(e){return !e.date;});
    $('undated').innerHTML=und.length?'<h3>Needs a date</h3>'+und.map(evHTML).join(''):'';
    updateSetupBanner();
  }

  $('grid').addEventListener('click',function(ev){
    var b=ev.target.closest('[data-day]');if(!b)return;
    var k=b.getAttribute('data-day');sel=(sel===k)?null:k;
    var d=parseISO(k);if(d.getMonth()!==view.getMonth())view=new Date(d.getFullYear(),d.getMonth(),1);
    render();
  });
  $('prev').onclick=function(){view=new Date(view.getFullYear(),view.getMonth()-1,1);render();};
  $('next').onclick=function(){view=new Date(view.getFullYear(),view.getMonth()+1,1);render();};
  document.addEventListener('click',function(ev){
    var e=ev.target.closest('[data-edit]'),d=ev.target.closest('[data-del]');
    if(e)openEdit(e.getAttribute('data-edit'));
    if(d){var id=d.getAttribute('data-del');events=events.filter(function(x){return x.id!==id;});persist();render();}
  });

  function openEdit(id){
    var e=events.filter(function(x){return x.id===id;})[0];if(!e)return;
    editing=id;
    $('f-title').value=e.title||'';$('f-date').value=e.date||'';
    $('f-start').value=e.start||'';$('f-end').value=e.end||'';$('f-loc').value=e.location||'';
    $('dlg').showModal();
  }
  $('cancel').onclick=function(){$('dlg').close();};
  $('save').onclick=function(){
    var e=events.filter(function(x){return x.id===editing;})[0];
    if(e){e.title=$('f-title').value.trim();e.date=$('f-date').value;e.start=$('f-start').value;e.end=$('f-end').value;e.location=$('f-loc').value.trim();
      persist();if(e.date){var d=parseISO(e.date);view=new Date(d.getFullYear(),d.getMonth(),1);}render();}
    $('dlg').close();
  };

  $('settingsBtn').onclick=function(){
    $('f-key').value=getApiKey();
    $('settings').showModal();
  };
  $('cancelSettings').onclick=function(){$('settings').close();};
  $('clearKey').onclick=function(){setApiKey('');$('f-key').value='';updateSetupBanner();};
  $('saveKey').onclick=function(){
    setApiKey($('f-key').value.trim());
    $('settings').close();
    updateSetupBanner();
  };

  /* ---------- ICS export ---------- */
  function icsEscape(s){
    return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
  }
  function icsStamp(d){
    function p(n){return String(n).padStart(2,'0');}
    return d.getUTCFullYear()+p(d.getUTCMonth()+1)+p(d.getUTCDate())+'T'+p(d.getUTCHours())+p(d.getUTCMinutes())+p(d.getUTCSeconds())+'Z';
  }
  function icsLocal(date,time,asDate){
    var p=date.split('-');
    if(asDate||!time)return p[0]+p[1]+p[2];
    var t=time.split(':');
    return p[0]+p[1]+p[2]+'T'+String(t[0]).padStart(2,'0')+String(t[1]||'0').padStart(2,'0')+'00';
  }
  function nextDay(date){
    var d=parseISO(date);d.setDate(d.getDate()+1);return iso(d);
  }
  function buildICS(list){
    var lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Flyer Calendar//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
    var nowStamp=icsStamp(new Date());
    list.forEach(function(e){
      if(!e.date)return;
      var uid=(e.id||('e'+Math.random().toString(36).slice(2)))+'@flyercal';
      var timed=!!e.start;
      var dtStart=icsLocal(e.date,e.start,!timed);
      var dtEnd;
      if(timed){
        if(e.end&&e.end>e.start)dtEnd=icsLocal(e.date,e.end,false);
        else{
          var parts=e.start.split(':'),h=+parts[0]+1,m=parts[1]||'00';
          if(h>23){dtEnd=icsLocal(nextDay(e.date),String(h-24).padStart(2,'0')+':'+m,false);}
          else dtEnd=icsLocal(e.date,String(h).padStart(2,'0')+':'+m,false);
        }
      }else{
        dtEnd=icsLocal(nextDay(e.date),'',true);
      }
      lines.push('BEGIN:VEVENT');
      lines.push('UID:'+uid);
      lines.push('DTSTAMP:'+nowStamp);
      if(timed){
        lines.push('DTSTART:'+dtStart);
        lines.push('DTEND:'+dtEnd);
      }else{
        lines.push('DTSTART;VALUE=DATE:'+dtStart);
        lines.push('DTEND;VALUE=DATE:'+dtEnd);
      }
      lines.push('SUMMARY:'+icsEscape(e.title||'Untitled event'));
      if(e.location)lines.push('LOCATION:'+icsEscape(e.location));
      lines.push('END:VEVENT');
    });
    lines.push('END:VCALENDAR');
    return lines.join('\r\n');
  }
  async function exportICS(){
    var list=events.filter(function(e){return e.date;}).sort(sortEv);
    if(!list.length){
      $('status').innerHTML='';
      line('No dated events to export.','bad');
      return;
    }
    var ics=buildICS(list);
    var blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
    var name='flyer-calendar.ics';
    try{
      if(navigator.share&&navigator.canShare){
        var file=new File([blob],name,{type:'text/calendar'});
        if(navigator.canShare({files:[file]})){
          await navigator.share({files:[file],title:'Flyer Calendar'});
          $('status').innerHTML='';
          line('Shared '+list.length+' event'+(list.length>1?'s':'')+'.','ok');
          return;
        }
      }
    }catch(err){
      if(err&&err.name==='AbortError')return;
    }
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download=name;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
    $('status').innerHTML='';
    line('Downloaded '+list.length+' event'+(list.length>1?'s':'')+' as '+name+'. Open it in Apple or Google Calendar.','ok');
  }
  $('exportBtn').onclick=function(){exportICS();};

  /* ---------- Gemini flyer reading ---------- */
  function line(msg,cls){var d=document.createElement('div');d.className=cls||'';d.textContent=msg;$('status').appendChild(d);return d;}

  function shrink(file){
    return new Promise(function(res,rej){
      var img=new Image(),url=URL.createObjectURL(file);
      img.onload=function(){
        var s=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function(b){res(b||file);},'image/jpeg',0.85);
      };
      img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('Could not open image'));};
      img.src=url;
    });
  }
  function blobToBase64(blob){
    return new Promise(function(res,rej){
      var r=new FileReader();
      r.onload=function(){
        var s=String(r.result||'');
        var i=s.indexOf(',');
        res(i>=0?s.slice(i+1):s);
      };
      r.onerror=function(){rej(new Error('Could not read image'));};
      r.readAsDataURL(blob);
    });
  }
  function parseJSON(t){
    t=String(t||'').replace(/```json|```/g,'').trim();
    var a=t.search(/[\[{]/);if(a<0)throw new Error('no json');
    var v=JSON.parse(t.slice(a));return Array.isArray(v)?v:[v];
  }
  function normalizeEvent(x){
    if(!x||typeof x!=='object')return null;
    var title=String(x.title||'').trim();
    var date=String(x.date||'').trim();
    var start=String(x.start||'').trim();
    var end=String(x.end||'').trim();
    var location=String(x.location||'').trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date))date='';
    if(!/^\d{2}:\d{2}$/.test(start))start='';
    if(!/^\d{2}:\d{2}$/.test(end))end='';
    if(!title&&!date)return null;
    return {title:title,date:date,start:start,end:end,location:location};
  }

  async function readWithGemini(blob,apiKey){
    var b64=await blobToBase64(blob);
    var prompt='Today is '+today+'. This image is an event flyer or screenshot of one (ignore phone status bars, Instagram/Facebook UI, stories, music stickers, and nav bars). '+
      'Extract every distinct event date shown. Reply with ONLY JSON (no markdown): either one object or an array of objects with this shape: '+
      '{"title":string,"date":"YYYY-MM-DD" or null,"start":"HH:MM" (24-hour) or null,"end":"HH:MM" or null,"location":string}. '+
      'If the flyer shows no year, use the next occurrence of that date on or after today. '+
      'For tour posters with multiple cities/dates, return one object per stop. '+
      'Use null when unsure; never invent a date, time, or location. Prefer artist + show name for title when both appear.';

    var url='https://generativelanguage.googleapis.com/v1beta/models/'+GEMINI_MODEL+':generateContent?key='+encodeURIComponent(apiKey);
    var body={
      contents:[{parts:[
        {text:prompt},
        {inline_data:{mime_type:'image/jpeg',data:b64}}
      ]}],
      generationConfig:{
        temperature:0.2,
        responseMimeType:'application/json'
      }
    };
    var resp=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    var data=await resp.json().catch(function(){return {};});
    if(!resp.ok){
      var msg=(data.error&&data.error.message)||('Gemini error '+resp.status);
      if(resp.status===400&&/API key/i.test(msg))throw new Error('Invalid API key. Check Settings.');
      if(resp.status===403)throw new Error('API key blocked or restricted. Check Google AI Studio.');
      if(resp.status===429)throw new Error('Rate limited. Wait a moment and try again.');
      throw new Error(msg);
    }
    var text='';
    try{
      text=data.candidates[0].content.parts.map(function(p){return p.text||'';}).join('');
    }catch(e){throw new Error('No response from Gemini.');}
    return parseJSON(text).map(normalizeEvent).filter(Boolean);
  }

  async function handle(files){
    files=Array.prototype.filter.call(files,function(f){return /^image\//.test(f.type);});
    if(!files.length)return;
    $('status').innerHTML='';
    var apiKey=getApiKey();
    if(!apiKey){
      line('Add your free Gemini API key in Settings first.','bad');
      $('settingsBtn').click();
      return;
    }
    for(var i=0;i<files.length;i++){
      var row=line('Reading '+files[i].name+' with Gemini…');
      try{
        var blob=await shrink(files[i]);
        var found=await readWithGemini(blob,apiKey),added=0;
        found.forEach(function(x){
          events.push({id:'e'+Date.now()+Math.random().toString(36).slice(2,6),title:x.title||'',date:x.date||'',start:x.start||'',end:x.end||'',location:x.location||''});
          added++;
        });
        if(added){
          persist();
          row.className='ok';
          row.textContent='Added '+added+' event'+(added>1?'s':'')+' from '+files[i].name;
          var dated=events.filter(function(e){return e.date;}).sort(sortEv);
          var last=dated[dated.length-1]||events[events.length-1];
          if(last&&last.date){var d=parseISO(last.date);view=new Date(d.getFullYear(),d.getMonth(),1);}
          sel=null;render();
        }else{
          row.className='bad';
          row.textContent='No event found in '+files[i].name+'.';
        }
      }catch(err){
        row.className='bad';
        row.textContent=(err&&err.message)||('Couldn’t read '+files[i].name+'. Try again.');
      }
    }
  }
  $('file').addEventListener('change',function(e){handle(e.target.files);e.target.value='';});
  var drop=$('drop');
  ['dragenter','dragover'].forEach(function(n){drop.addEventListener(n,function(e){e.preventDefault();drop.classList.add('over');});});
  ['dragleave','drop'].forEach(function(n){drop.addEventListener(n,function(e){e.preventDefault();drop.classList.remove('over');});});
  drop.addEventListener('drop',function(e){handle(e.dataTransfer.files);});

  (function(){
    var el=$('install');
    var standalone=window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone===true;
    if(standalone)return;
    var isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    var isAndroid=/Android/i.test(navigator.userAgent);
    if(isIOS){
      el.innerHTML='<b>Add to Home Screen</b> — tap Share, then “Add to Home Screen” for the app icon.';
      el.className='show';
    }else if(isAndroid){
      el.innerHTML='<b>Install app</b> — use Chrome’s menu → “Install app” or “Add to Home screen”.';
      el.className='show';
    }
  })();

  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    });
  }

  render();
})();
</script>
</body>
</html>
