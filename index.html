<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c2410c">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Read event flyers and add them to your calendar.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FlyerCal">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Flyer Calendar</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--ink:#1f1b16;--mute:#6f675d;--line:#e6e0d8;--acc:#c2410c;--acc-ink:#fff;--soft:#fdeee3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161412;--card:#201d1a;--ink:#f3eee8;--mute:#a39a8e;--line:#34302b;--acc:#f97316;--acc-ink:#1a1008;--soft:#2e2118;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161412;--card:#201d1a;--ink:#f3eee8;--mute:#a39a8e;--line:#34302b;--acc:#f97316;--acc-ink:#1a1008;--soft:#2e2118;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 16px}
.drop{display:block;border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;background:var(--card);cursor:pointer}
.drop.over{border-color:var(--acc);background:var(--soft)}
.drop b{color:var(--acc)}
.drop input{display:none}
#status{margin:10px 0 0;font-size:.9rem;color:var(--mute)}
#status div{padding:2px 0}
.ok{color:#15803d}.bad{color:#b91c1c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ok{color:#4ade80}:root:not([data-theme="light"]) .bad{color:#f87171}}
.cal{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.head h2{font-size:1.1rem;margin:0}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button.p{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dow{font-size:.72rem;color:var(--mute);padding:4px 0}
.day{aspect-ratio:1;border-radius:8px;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.9rem;cursor:pointer;background:transparent;padding:0}
.day.out{color:var(--mute);opacity:.45}
.day.today{border-color:var(--acc)}
.day.sel{background:var(--soft)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--acc);margin-top:3px}
.dot.n{background:transparent}
h3{font-size:1rem;margin:22px 0 8px}
.ev{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.ev .t{font-weight:600}.ev .m{color:var(--mute);font-size:.88rem}
.acts{display:flex;gap:6px;flex-shrink:0}
.acts button{padding:4px 10px;font-size:.85rem}
.empty{color:var(--mute);font-size:.92rem}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:18px;width:min(92vw,400px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;font-size:.82rem;color:var(--mute);margin-top:10px}
input[type=text],input[type=date],input[type=time]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
.row{display:flex;gap:10px}.row>div{flex:1}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#install{display:none;margin:0 0 14px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--mute);font-size:.9rem}
#install.show{display:block}
#install b{color:var(--ink)}
@media (display-mode:standalone),(display-mode:fullscreen){#install{display:none!important}}
</style>
</head>
<body>
<main>
  <h1>Flyer Calendar</h1>
  <p class="sub">Drop in flyer screenshots. Text is read in your browser and added to the calendar.</p>
  <div id="install"></div>
  <label class="drop" id="drop">
    <input type="file" id="file" accept="image/*" multiple>
    <b>Choose screenshots</b> or drag them here
  </label>
  <div id="status"></div>

  <div class="cal">
    <div class="head">
      <button id="prev" aria-label="Previous month">‹</button>
      <h2 id="mt"></h2>
      <button id="next" aria-label="Next month">›</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <h3 id="lt">Upcoming</h3>
  <div id="list"></div>
  <div id="undated"></div>
</main>

<dialog id="dlg">
  <div id="dtitle" style="font-weight:600">Edit event</div>
  <label>Title<input type="text" id="f-title"></label>
  <label>Date<input type="date" id="f-date"></label>
  <div class="row">
    <div><label>Start<input type="time" id="f-start"></label></div>
    <div><label>End<input type="time" id="f-end"></label></div>
  </div>
  <label>Location<input type="text" id="f-loc"></label>
  <div class="btns"><button id="cancel">Cancel</button><button class="p" id="save">Save</button></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
(function(){
  var KEY='flyercal:events';
  var events=[];
  try{events=JSON.parse(localStorage.getItem(KEY)||'[]')||[];}catch(e){events=[];}
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(events));}catch(e){}}
  var now=new Date();
  var view=new Date(now.getFullYear(),now.getMonth(),1);
  var sel=null, editing=null;
  var $=function(id){return document.getElementById(id);};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  var today=iso(now);
  function parseISO(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
  function fmtDate(s){return parseISO(s).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});}
  function fmtTime(t){if(!t)return '';var p=t.split(':'),h=+p[0],m=p[1];return ((h%12)||12)+(m==='00'?'':':'+m)+(h<12?' AM':' PM');}
  function when(e){var t=fmtTime(e.start);if(t&&e.end)t+=' – '+fmtTime(e.end);return [e.date?fmtDate(e.date):'',t].filter(Boolean).join(' · ');}

  function evHTML(e){
    var meta=[when(e),e.location].filter(Boolean).join(' · ');
    return '<div class="ev"><div><div class="t">'+esc(e.title||'Untitled event')+'</div><div class="m">'+esc(meta)+'</div></div>'+
      '<div class="acts"><button data-edit="'+e.id+'">Edit</button><button data-del="'+e.id+'">Delete</button></div></div>';
  }
  function sortEv(a,b){return (a.date+(a.start||'')).localeCompare(b.date+(b.start||''));}

  function render(){
    $('mt').textContent=view.toLocaleDateString(undefined,{month:'long',year:'numeric'});
    var g='';['S','M','T','W','T','F','S'].forEach(function(d){g+='<div class="dow">'+d+'</div>';});
    var start=new Date(view.getFullYear(),view.getMonth(),1-view.getDay());
    var has={};events.forEach(function(e){if(e.date)has[e.date]=1;});
    for(var i=0;i<42;i++){
      var d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),k=iso(d);
      var cls='day'+(d.getMonth()!==view.getMonth()?' out':'')+(k===today?' today':'')+(k===sel?' sel':'');
      g+='<button class="'+cls+'" data-day="'+k+'">'+d.getDate()+'<span class="dot'+(has[k]?'':' n')+'"></span></button>';
    }
    $('grid').innerHTML=g;
    var list=events.filter(function(e){return e.date;}).sort(sortEv);
    if(sel){
      $('lt').textContent=fmtDate(sel);
      list=list.filter(function(e){return e.date===sel;});
      $('list').innerHTML=list.length?list.map(evHTML).join(''):'<div class="empty">Nothing on this day. Tap the day again to see all upcoming events.</div>';
    }else{
      $('lt').textContent='Upcoming';
      list=list.filter(function(e){return e.date>=today;});
      $('list').innerHTML=list.length?list.map(evHTML).join(''):'<div class="empty">No events yet. Add a flyer above.</div>';
    }
    var und=events.filter(function(e){return !e.date;});
    $('undated').innerHTML=und.length?'<h3>Needs a date</h3>'+und.map(evHTML).join(''):'';
  }

  $('grid').addEventListener('click',function(ev){
    var b=ev.target.closest('[data-day]');if(!b)return;
    var k=b.getAttribute('data-day');sel=(sel===k)?null:k;
    var d=parseISO(k);if(d.getMonth()!==view.getMonth())view=new Date(d.getFullYear(),d.getMonth(),1);
    render();
  });
  $('prev').onclick=function(){view=new Date(view.getFullYear(),view.getMonth()-1,1);render();};
  $('next').onclick=function(){view=new Date(view.getFullYear(),view.getMonth()+1,1);render();};
  document.addEventListener('click',function(ev){
    var e=ev.target.closest('[data-edit]'),d=ev.target.closest('[data-del]');
    if(e)openEdit(e.getAttribute('data-edit'));
    if(d){var id=d.getAttribute('data-del');events=events.filter(function(x){return x.id!==id;});persist();render();}
  });

  function openEdit(id){
    var e=events.filter(function(x){return x.id===id;})[0];if(!e)return;
    editing=id;
    $('f-title').value=e.title||'';$('f-date').value=e.date||'';
    $('f-start').value=e.start||'';$('f-end').value=e.end||'';$('f-loc').value=e.location||'';
    $('dlg').showModal();
  }
  $('cancel').onclick=function(){$('dlg').close();};
  $('save').onclick=function(){
    var e=events.filter(function(x){return x.id===editing;})[0];
    if(e){e.title=$('f-title').value.trim();e.date=$('f-date').value;e.start=$('f-start').value;e.end=$('f-end').value;e.location=$('f-loc').value.trim();
      persist();if(e.date){var d=parseISO(e.date);view=new Date(d.getFullYear(),d.getMonth(),1);}render();}
    $('dlg').close();
  };

  /* ---------- flyer reading (local OCR) ---------- */
  var MONTHS={january:0,jan:0,february:1,feb:1,march:2,mar:2,april:3,apr:3,may:4,june:5,jun:5,july:6,jul:6,august:7,aug:7,september:8,sept:8,sep:8,october:9,oct:9,november:10,nov:10,december:11,dec:11};
  var MONTH_RE='(?:January|February|March|April|May|June|July|August|September|October|November|December|Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:t(?:ember)?)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)';
  var DOW_RE='(?:Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday|Mon|Tue|Wed|Thu|Fri|Sat|Sun)';
  var STATES='Alabama|Alaska|Arizona|Arkansas|California|Colorado|Connecticut|Delaware|Florida|Georgia|Hawaii|Idaho|Illinois|Indiana|Iowa|Kansas|Kentucky|Louisiana|Maine|Maryland|Massachusetts|Michigan|Minnesota|Mississippi|Missouri|Montana|Nebraska|Nevada|New Hampshire|New Jersey|New Mexico|New York|North Carolina|North Dakota|Ohio|Oklahoma|Oregon|Pennsylvania|Rhode Island|South Carolina|South Dakota|Tennessee|Texas|Utah|Vermont|Virginia|Washington|West Virginia|Wisconsin|Wyoming|ILLINOIS|MISSOURI|MICHIGAN|OHIO|TEXAS|FLORIDA|GEORGIA|CALIFORNIA|NEW YORK';
  var KNOWN_CITIES=['ST. LOUIS','ST LOUIS','SAINT LOUIS','CHICAGO','DETROIT','ATLANTA','NASHVILLE','HOUSTON','DALLAS','AUSTIN','MIAMI','ORLANDO','TAMPA','PHILADELPHIA','BOSTON','SEATTLE','DENVER','PHOENIX','PORTLAND','MEMPHIS','NEW ORLEANS','CHARLOTTE','INDIANAPOLIS','COLUMBUS','CLEVELAND','PITTSBURGH','BALTIMORE','WASHINGTON','LOS ANGELES','SAN FRANCISCO','SAN DIEGO','MINNEAPOLIS','KANSAS CITY','OKLAHOMA CITY','LAS VEGAS','BROOKLYN','MANHATTAN'];

  function loadImage(file){
    return new Promise(function(res,rej){
      var img=new Image(),url=URL.createObjectURL(file);
      img.onload=function(){URL.revokeObjectURL(url);res(img);};
      img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('Could not open image'));};
      img.src=url;
    });
  }
  function canvasToBlob(c,q){
    return new Promise(function(res){c.toBlob(function(b){res(b);},'image/jpeg',q||0.9);});
  }
  function prepRegion(img,opts){
    var tw=img.naturalWidth||img.width,th=img.naturalHeight||img.height;
    var top=Math.round(th*(opts.top||0)), bot=Math.round(th*(opts.bot||0));
    var left=Math.round(tw*(opts.left||0)), right=Math.round(tw*(opts.right||0));
    var sw=Math.max(1,tw-left-right), sh=Math.max(1,th-top-bot);
    if(opts.sliceTop!=null){var st=Math.round(sh*opts.sliceTop), sh2=Math.round(sh*(opts.sliceH||0.5)); top+=st; sh=Math.max(1,sh2);}
    var scale=opts.scale||2;
    var c=document.createElement('canvas');
    c.width=Math.round(sw*scale); c.height=Math.round(sh*scale);
    var ctx=c.getContext('2d');
    ctx.imageSmoothingEnabled=true;
    ctx.drawImage(img,left,top,sw,sh,0,0,c.width,c.height);
    var id=ctx.getImageData(0,0,c.width,c.height),d=id.data,i,gray,v;
    for(i=0;i<d.length;i+=4){
      gray=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
      v=((gray-128)*1.55)+128;
      if(v<0)v=0;if(v>255)v=255;
      d[i]=d[i+1]=d[i+2]=v;
    }
    ctx.putImageData(id,0,0);
    return canvasToBlob(c,0.92);
  }
  async function prepareVariants(file){
    var img=await loadImage(file);
    var tall=(img.naturalHeight||img.height)/(img.naturalWidth||img.width)>1.4;
    var top=tall?0.17:0.04, bot=tall?0.13:0.04;
    return Promise.all([
      prepRegion(img,{top:top,bot:bot,scale:2}),
      prepRegion(img,{top:top,bot:bot,sliceTop:0.42,sliceH:0.5,scale:2.4})
    ]);
  }
  function line(msg,cls){var d=document.createElement('div');d.className=cls||'';d.textContent=msg;$('status').appendChild(d);return d;}

  function to24(h,m,ampm){
    h=+h;m=m==null||m===''?0:+m;
    if(ampm){
      ampm=ampm.toLowerCase();
      if(ampm.charAt(0)==='p'&&h<12)h+=12;
      if(ampm.charAt(0)==='a'&&h===12)h=0;
    }
    return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
  }
  function nextOccurrence(month,day,year){
    var y=year!=null?year:now.getFullYear();
    var d=new Date(y,month,day);
    if(year==null&&iso(d)<today)d=new Date(y+1,month,day);
    if(d.getMonth()!==month||d.getDate()!==day)return '';
    return iso(d);
  }
  function parseTimeToken(s){
    var m=String(s).trim().match(/^(\d{1,2})(?::(\d{2}))?\s*(a\.?m\.?|p\.?m\.?)?$/i);
    if(!m)return '';
    var h=+m[1],mm=m[2]||'0',ap=m[3];
    if(!ap)return '';
    if(h<1||h>12)return '';
    return to24(h,mm,ap);
  }
  function extractTimes(text){
    var start='',end='';
    var range=text.match(/(\d{1,2}(?::\d{2})?\s*(?:a\.?m\.?|p\.?m\.?)?)\s*[-–—to]+\s*(\d{1,2}(?::\d{2})?\s*(?:a\.?m\.?|p\.?m\.?))/i);
    if(range){
      var a=range[1],b=range[2];
      if(!/a\.?m\.?|p\.?m\.?/i.test(a)&&/a\.?m\.?|p\.?m\.?/i.test(b))a=a+' '+b.match(/a\.?m\.?|p\.?m\.?/i)[0];
      start=parseTimeToken(a);end=parseTimeToken(b);
      return {start:start,end:end};
    }
    var single=text.match(/\b(\d{1,2}(?::\d{2})?\s*(?:a\.?m\.?|p\.?m\.?))\b/i);
    if(single)start=parseTimeToken(single[1]);
    return {start:start,end:end};
  }
  function monthKey(s){return String(s).toLowerCase().replace(/\./g,'').slice(0,3);}
  function extractAllDates(text){
    var out=[], re=new RegExp('\\b('+MONTH_RE+')\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?\\b','gi'),m;
    while((m=re.exec(text))){
      var mk=monthKey(m[1]), month=MONTHS[mk];
      if(month==null)continue;
      var date=nextOccurrence(month,+m[2],null);
      if(date)out.push({date:date,index:m.index,raw:m[0]});
    }
    var seen={};
    return out.filter(function(d){if(seen[d.date])return false;seen[d.date]=1;return true;});
  }
  function isChromeLine(s){
    s=String(s||'');
    if(!s||s.length<2)return true;
    if(/^(www\.|https?:|instagram|facebook|tiktok|threads|your story|follow|sponsored|liked by|view insights)/i.test(s))return true;
    if(/\b(housefires|spotify|apple music|mercy\s*\/?\s*tremble)\b/i.test(s))return true;
    if(/^[A-Za-z0-9._]{2,20}(\s+[A-Za-z0-9._]{2,20}){1,4}$/.test(s)&&/\./.test(s)&&s.length<50)return true;
    if(/^\d{1,2}:\d{2}/.test(s)&&!/[ap]\.?m\.?/i.test(s))return true;
    if(/^[^\w]*$/.test(s))return true;
    if((s.match(/[^A-Za-z0-9\s.,'&:-]/g)||[]).length>Math.max(2,s.length*0.35))return true;
    return false;
  }
  function letterScore(s){
    var letters=(s.match(/[A-Za-z]/g)||[]).length;
    return letters/Math.max(1,s.length);
  }
  function titleCaseWords(s){
    return s.replace(/\s+/g,' ').trim().replace(/\b[A-Za-z][A-Za-z']*/g,function(w){
      if(w.length<=2&&w===w.toUpperCase())return w;
      return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();
    });
  }
  function extractTitle(lines,full){
    var cands=[],i,l,norm;
    for(i=0;i<lines.length;i++){
      l=lines[i].replace(/^[#*\-•\s]+/,'').trim();
      if(isChromeLine(l)||looksLikeDateLine(l))continue;
      if(/^(at|@|venue|location|doors|admission|free|rsvp|tickets?|and)\b/i.test(l))continue;
      if(new RegExp('\\b(?:'+STATES+')\\b','i').test(l)&&l.length<40)continue;
      if(KNOWN_CITIES.some(function(c){return l.toUpperCase().indexOf(c)>=0;})&&l.length<40)continue;
      if(letterScore(l)<0.55||l.length<4)continue;
      norm=l.replace(/[^A-Za-z\s']/g,' ').replace(/\s+/g,' ').trim();
      if(norm.length<4)continue;
      cands.push(norm);
    }
    if(!cands.length){
      var m=full.match(/unscripted\s+christmas/i)||full.match(/[A-Z]{3,}(?:\s+[A-Z]{3,}){0,4}\s+CHRISTMAS/);
      if(m)return titleCaseWords(m[0]);
      return '';
    }
    var joined=[];
    for(i=0;i<Math.min(cands.length,4);i++){
      var w=cands[i];
      if(joined.join(' ').length+w.length>48)break;
      if(joined.some(function(x){return x.toLowerCase().indexOf(w.toLowerCase())>=0||w.toLowerCase().indexOf(x.toLowerCase())>=0;}))continue;
      joined.push(w);
      if(/christmas|tour|concert|live|festival|night|worship|gospel/i.test(w))break;
    }
    return titleCaseWords(joined.join(' ')).slice(0,80);
  }
  function looksLikeDateLine(s){
    return new RegExp('\\b(?:'+MONTH_RE+')\\.?\\s+\\d{1,2}\\b','i').test(s)
      ||new RegExp('^\\s*(?:'+DOW_RE+')\\b','i').test(s);
  }
  function findCities(text){
    var up=text.toUpperCase().replace(/[|]/g,' ').replace(/\s+/g,' ');
    var found=[],i,c,idx;
    for(i=0;i<KNOWN_CITIES.length;i++){
      c=KNOWN_CITIES[i];
      idx=up.indexOf(c);
      if(idx>=0)found.push({city:titleCaseWords(c.replace(/\bSt\b/i,'St.')),index:idx,key:c});
    }
    found.sort(function(a,b){return a.index-b.index;});
    var uniq=[],seen={};
    found.forEach(function(f){
      var k=f.city.toLowerCase().replace(/\./g,'');
      if(seen[k]||seen[k.replace(/^saint /,'st ')]||seen[k.replace(/^st /,'saint ')])return;
      seen[k]=1;uniq.push(f);
    });
    return uniq;
  }
  function findStatesNear(text){
    var re=new RegExp('\\b('+STATES+')\\b','gi'),m,out=[];
    while((m=re.exec(text)))out.push(titleCaseWords(m[1]));
    return out;
  }
  function extractLocation(lines,full){
    var i,m,l;
    for(i=0;i<lines.length;i++){
      l=lines[i];
      m=l.match(/\b(?:at|venue|location)\s*[:\-]?\s*(.+)$/i);
      if(m&&m[1].trim().length>2&&!isChromeLine(m[1]))return m[1].replace(/^the\s+/i,'').trim();
    }
    var cities=findCities(full);
    if(cities.length===1){
      var states=findStatesNear(full);
      return states[0]?cities[0].city+', '+states[0]:cities[0].city;
    }
    for(i=0;i<lines.length;i++){
      l=lines[i];
      if(/\d{1,5}\s+[A-Za-z].+\b(?:St|Street|Ave|Avenue|Rd|Road|Blvd|Boulevard|Dr|Drive|Ln|Lane|Way|Court|Ct)\b/i.test(l))return l.trim();
      if(/\b(?:Hall|Center|Centre|Theatre|Theater|Church|Park|Museum|Library|Cafe|Café|Bar|Club|Arena|Stadium|Gallery|Plaza|Room)\b/i.test(l)
        &&!looksLikeDateLine(l)&&!isChromeLine(l)&&l.length<80)return l.trim();
    }
    return '';
  }
  function parseFlyerText(text){
    text=String(text||'').replace(/\r/g,'\n').replace(/[|]+/g,' ').replace(/[ \t]+/g,' ');
    var lines=text.split('\n').map(function(l){return l.trim();}).filter(function(l){return l.length>1&&!isChromeLine(l);});
    var full=lines.join('\n');
    var times=extractTimes(full);
    var title=extractTitle(lines,text);
    var dates=extractAllDates(text);
    var cities=findCities(text);
    var states=findStatesNear(text);

    if(dates.length>=2){
      return dates.map(function(d,i){
        var loc='';
        if(cities[i])loc=cities[i].city+(states[i]?', '+states[i]:'');
        else if(cities.length===1)loc=cities[0].city;
        return {title:title||'Untitled event',date:d.date,start:times.start,end:times.end,location:loc};
      });
    }
    if(dates.length===1){
      var loc=extractLocation(lines,full);
      if(!loc&&cities[0])loc=cities[0].city+(states[0]?', '+states[0]:'');
      return [{title:title||'Untitled event',date:dates[0].date,start:times.start,end:times.end,location:loc}];
    }
    var date='',loc=extractLocation(lines,full);
    if(cities[0]&&!loc)loc=cities[0].city+(states[0]?', '+states[0]:'');
    if(!title&&!date&&!loc)return [];
    if(!title)title='Untitled event';
    return [{title:title,date:date,start:times.start,end:times.end,location:loc}];
  }

  async function ocrBlob(blob){
    var result=await Tesseract.recognize(blob,'eng',{
      tessedit_pageseg_mode:'6'
    });
    return (result&&result.data&&result.data.text)||'';
  }
  async function ocrImage(blobs,row){
    if(typeof Tesseract==='undefined')throw new Error('OCR library failed to load. Check your network connection.');
    var texts=[],i;
    for(i=0;i<blobs.length;i++){
      if(row)row.textContent=row.dataset.base+' ('+(i+1)+'/'+blobs.length+')';
      texts.push(await ocrBlob(blobs[i]));
    }
    return texts.join('\n');
  }

  async function handle(files){
    files=Array.prototype.filter.call(files,function(f){return /^image\//.test(f.type);});
    if(!files.length)return;
    $('status').innerHTML='';
    for(var i=0;i<files.length;i++){
      var row=line('Reading '+files[i].name+'…');
      row.dataset.base='Reading '+files[i].name+'…';
      try{
        var blobs=await prepareVariants(files[i]);
        var text=await ocrImage(blobs,row);
        var found=parseFlyerText(text),added=0,firstId=null;
        found.forEach(function(x){
          if(!x||(!x.title&&!x.date))return;
          var id='e'+Date.now()+Math.random().toString(36).slice(2,6);
          if(!firstId)firstId=id;
          events.push({id:id,title:x.title||'',date:/^\d{4}-\d{2}-\d{2}$/.test(x.date||'')?x.date:'',start:x.start||'',end:x.end||'',location:x.location||''});
          added++;
        });
        if(added){
          persist();row.className='ok';
          row.textContent='Added '+added+' event'+(added>1?'s':'')+' from '+files[i].name+' — check Edit if anything looks off.';
          var last=events.filter(function(e){return e.date;}).sort(sortEv).slice(-1)[0]||events[events.length-1];
          if(last&&last.date){var d=parseISO(last.date);view=new Date(d.getFullYear(),d.getMonth(),1);}
          sel=null;render();
          if(firstId)openEdit(firstId);
        }else{row.className='bad';row.textContent='No event found in '+files[i].name+'. Try a clearer screenshot of just the flyer.';}
      }catch(err){
        row.className='bad';
        row.textContent=(err&&err.message)||('Couldn’t read '+files[i].name+'. Try again.');
      }
    }
  }
  $('file').addEventListener('change',function(e){handle(e.target.files);e.target.value='';});
  var drop=$('drop');
  ['dragenter','dragover'].forEach(function(n){drop.addEventListener(n,function(e){e.preventDefault();drop.classList.add('over');});});
  ['dragleave','drop'].forEach(function(n){drop.addEventListener(n,function(e){e.preventDefault();drop.classList.remove('over');});});
  drop.addEventListener('drop',function(e){handle(e.dataTransfer.files);});

  /* ---------- PWA install hint ---------- */
  (function(){
    var el=$('install');
    var standalone=window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone===true;
    if(standalone)return;
    var isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    var isAndroid=/Android/i.test(navigator.userAgent);
    if(isIOS){
      el.innerHTML='<b>Add to Home Screen</b> — tap Share, then “Add to Home Screen” for the app icon.';
      el.className='show';
    }else if(isAndroid){
      el.innerHTML='<b>Install app</b> — use Chrome’s menu → “Install app” or “Add to Home screen”.';
      el.className='show';
    }
  })();

  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    });
  }

  render();
})();
</script>
